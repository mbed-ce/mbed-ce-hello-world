# Example GitHub Actions workflow which provides a CI build for your Mbed CE project.

name: Test that this Mbed project compiles

on: push

jobs:
  compile:
    runs-on: ubuntu-latest
    container: ghcr.io/mbed-ce/mbed-ce-env:main
    
    strategy:
      matrix:
        mbed_target: 
          # Change the below to match the target you want to compile the project for.
          - LPC1768
          - NUCLEO_F070RB
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Note: We only want to check out one layer of submodules here because Mbed CE will automatically
          # check out its submodules if they needed for the current build.
          submodules: true

      - name: Build project for ${{ matrix.mbed_target }}
        run: |
            mkdir build && cd build
            cmake .. -GNinja -DMBED_TARGET=${{ matrix.mbed_target }}
            ninja
